server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/security}
    username: ${DB_USER:security}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
security:
  registration-enabled: ${REGISTRATION_ENABLED:false}
  session-hours: ${SESSION_HOURS:24}
  viewer-lease-ms: 15000
  command-ttl-ms: 30000
