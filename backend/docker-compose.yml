services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: security
      POSTGRES_USER: security
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security -d security"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/security
      DB_PASSWORD: ${DB_PASSWORD}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      SERVER_PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  proxy:
    image: caddy:2
    environment:
      CLOUD_DOMAIN: ${CLOUD_DOMAIN:?Set CLOUD_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  database:
  certificates:
  caddy_config:
